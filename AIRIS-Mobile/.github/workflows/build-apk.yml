name: Build AIRIS Standalone APK

on:
  workflow_dispatch:

concurrency:
  group: airis-apk-build
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Submit EAS Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit EAS Build
        run: |
          echo "Submitting standalone build to Expo EAS Cloud..."
          eas build --platform android --profile preview --non-interactive --no-wait
          echo "Build successfully submitted! Track progress on your Expo Dashboard (https://expo.dev)."
