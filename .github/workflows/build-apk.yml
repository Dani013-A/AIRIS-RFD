name: Build AIRIS Standalone Release APK

on:
  push:
    branches:
      - main
      - integration/unity-immersive
    paths:
      - "AIRIS-Mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      build_method:
        description: "Build method: 'native' (standalone Gradle) or 'eas' (Expo Application Services)"
        required: false
        default: "native"
        type: choice
        options:
          - native
          - eas

concurrency:
  group: airis-apk-build
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build Standalone Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free runner disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -a -f --volumes || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AIRIS-Mobile/package-lock.json

      - name: Restore Mobile environment and persistent signing keystore
        working-directory: AIRIS-Mobile
        env:
          AIRIS_MOBILE_ENV_BASE64: ${{ secrets.AIRIS_MOBILE_ENV_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          node -e '
            const fs = require("fs");
            const envB64 = process.env.AIRIS_MOBILE_ENV_BASE64;
            if (!envB64 || envB64.trim() === "" || envB64.trim() === "-") {
              console.error("::error::AIRIS_MOBILE_ENV_BASE64 secret is missing or invalid.");
              process.exit(1);
            }
            fs.writeFileSync(".env", Buffer.from(envB64.trim(), "base64"));
            console.log("Successfully restored .env configuration (" + fs.statSync(".env").size + " bytes).");

            const ksB64 = process.env.ANDROID_KEYSTORE_BASE64;
            if (!ksB64 || ksB64.trim() === "" || ksB64.trim() === "-") {
              console.error("::error::ANDROID_KEYSTORE_BASE64 secret is missing or invalid.");
              process.exit(1);
            }
            fs.writeFileSync("android/app/debug.keystore", Buffer.from(ksB64.trim(), "base64"));
            console.log("Successfully restored persistent release signing keystore (" + fs.statSync("android/app/debug.keystore").size + " bytes).");
          '

      - name: Install dependencies
        working-directory: AIRIS-Mobile
        run: npm ci

      - name: Verify TypeScript compilation
        working-directory: AIRIS-Mobile
        run: npx tsc --noEmit

      - name: Run Jest test suites
        working-directory: AIRIS-Mobile
        run: npx jest --runInBand

      - name: Run Node-native test suites
        working-directory: AIRIS-Mobile
        run: node --test src/components/ui/typographyScale.test.mjs src/screens/interview/standardInterviewUi.test.mjs src/services/learning/learningCatalogQuality.test.cjs src/store/appearanceStore.test.cjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-36 build-tools;34.0.0 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Rebuild Unity native library from patched source
        working-directory: AIRIS-Mobile/android
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" python3 build_native.py

      # Path A: EAS Build (if explicitly requested)
      - name: Install EAS CLI
        if: github.event.inputs.build_method == 'eas'
        run: npm install -g eas-cli

      - name: Submit and Wait for EAS Android APK Build
        if: github.event.inputs.build_method == 'eas'
        id: eas-build
        working-directory: AIRIS-Mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        continue-on-error: true
        run: |
          echo "Starting EAS preview APK build for Android..."
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > build-output.json || exit 1

          BUILD_URL=$(node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('build-output.json', 'utf8'));
            const build = Array.isArray(data) ? data[0] : data;
            const url = build.artifacts?.buildUrl || build.artifacts?.applicationArchiveUrl || '';
            process.stdout.write(url);
          ")

          BUILD_ID=$(node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('build-output.json', 'utf8'));
            const build = Array.isArray(data) ? data[0] : data;
            process.stdout.write(build.id || '');
          ")

          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Download APK from EAS Artifacts
        if: github.event.inputs.build_method == 'eas' && steps.eas-build.outputs.build_url != ''
        working-directory: AIRIS-Mobile
        run: |
          echo "Downloading APK from: ${{ steps.eas-build.outputs.build_url }}"
          curl -L -o AIRIS-Release.apk "${{ steps.eas-build.outputs.build_url }}"
          ls -lh AIRIS-Release.apk

      # Path B: Native Standalone Gradle Build (default, quota-safe, deterministic)
      - name: Build Standalone Release APK via Gradle
        if: github.event.inputs.build_method != 'eas' || steps.eas-build.outcome == 'failure' || steps.eas-build.outputs.build_url == ''
        working-directory: AIRIS-Mobile/android
        run: |
          echo "Building standalone APK via native Gradle..."
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          sed -i '/^unity\.androidNdkPath=/d' gradle.properties
          sed -i '/^unity\.androidSdkPath=/d' gradle.properties
          sed -i 's/-Xmx2048m/-Xmx4096m/g' gradle.properties
          sed -i 's/-XX:MaxMetaspaceSize=512m/-XX:MaxMetaspaceSize=1024m/g' gradle.properties
          sed -i 's/android.enableJetifier=true/android.enableJetifier=false/g' gradle.properties
          if [ ! -f "app/debug.keystore" ]; then
            echo "::error::Persistent debug.keystore is missing. Refusing to sign with ephemeral keys."
            exit 1
          fi
          echo "Verifying persistent signing keystore certificate fingerprint..."
          keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256:|SHA1:"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -Punity.androidSdkPath="$ANDROID_HOME"
          ls -lh app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ../AIRIS-Release.apk

      - name: Verify standalone APK and rebuilt native library
        working-directory: AIRIS-Mobile
        run: python3 android/verify_release_apk.py AIRIS-Release.apk

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airis-mobile-release-apk
          path: |
            AIRIS-Mobile/AIRIS-Release.apk
            AIRIS-Mobile/AIRIS-Release.json
            AIRIS-Mobile/android/unityLibrary/build/native-release/native-build.json
          if-no-files-found: error
          retention-days: 30
