services:
  backend:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    expose:
      - "8000"
    volumes:
      - /opt/airis/secrets/firebase-service-account.json:/opt/airis/secrets/firebase-service-account.json:ro

  web:
    image: airis-web:latest
    restart: always
    expose:
      - "3000"
    volumes:
      - /opt/airis/repo/AIRIS-Web/public/download:/app/public/download:ro

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - BACKEND_DOMAIN=${BACKEND_DOMAIN:-18-143-33-249.sslip.io}
      - ADMIN_DOMAIN=${ADMIN_DOMAIN:-admin.18-143-33-249.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - web

volumes:
  caddy_data:
  caddy_config:
