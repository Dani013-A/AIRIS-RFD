services:
  backend:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    expose:
      - "8000"
    volumes:
      - /opt/airis/secrets/firebase-service-account.json:/opt/airis/secrets/firebase-service-account.json:ro

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
